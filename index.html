<!doctype html>
<html lang="en">
  <head>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-B6FJZNFFW6"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-B6FJZNFFW6");
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aïssa Dingenotto Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="./magpie.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #222;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      @supports (min-height: 100dvh) {
        body {
          min-height: 100dvh;
        }
      }

      .pdf-shell {
        position: relative;
        width: 100%;
        height: 100vh;
        background: #222;
      }

      @supports (height: 100dvh) {
        .pdf-shell {
          height: 100dvh;
        }
      }

      .pdf-loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #ddd;
        font-size: 1rem;
        letter-spacing: 0.02em;
      }

      .pdf-viewer {
        position: relative;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .pdf-shell.is-loaded .pdf-viewer {
        opacity: 1;
      }

      .pdf-shell.is-loaded .pdf-loading {
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- Update the src file parameter when publishing a new portfolio PDF. -->
    <div class="pdf-shell" aria-busy="true">
      <div class="pdf-loading">Loading portfolio…</div>
      <iframe
        class="pdf-viewer"
        src="./pdfjs/web/viewer.html?file=../../Aissa_Portfolio_QR.18.April.26.pdf"
        title="Portfolio PDF"
        allow="fullscreen"
        loading="eager"
        onload="
          this.parentElement.classList.add('is-loaded');
          this.parentElement.removeAttribute('aria-busy');
        "
      >
      </iframe>
    </div>
  </body>
</html>
